<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142238" />
      <stop offset="100%" stop-color="#0b1322" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72d3a7" />
      <stop offset="55%" stop-color="#258b68" />
      <stop offset="100%" stop-color="#175943" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d38c" />
      <stop offset="50%" stop-color="#d4a453" />
      <stop offset="100%" stop-color="#9e7123" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg2)" stroke="#243756" stroke-width="4" />

  <!-- Perspective GIS Map Grid Base -->
  <g stroke="#243b5e" stroke-width="2" opacity="0.75">
    <ellipse cx="256" cy="390" rx="168" ry="46" fill="#13253e" fill-opacity="0.6" stroke="#2f4f7d" stroke-width="2.5" />
    <ellipse cx="256" cy="390" rx="112" ry="30" fill="none" stroke="#366196" stroke-dasharray="6 6" />
    <ellipse cx="256" cy="390" rx="54" ry="15" fill="none" stroke="#72d3a7" stroke-opacity="0.7" />
    <line x1="88" y1="390" x2="424" y2="390" opacity="0.4" />
    <line x1="256" y1="344" x2="256" y2="436" opacity="0.4" />
  </g>

  <!-- Cloud Guard + GIS Location Pin Hybrid -->
  <path d="M 256 84
           C 332 84, 384 134, 384 204
           C 384 278, 298 344, 256 386
           C 214 344, 128 278, 128 204
           C 128 134, 180 84, 256 84 Z"
        fill="url(#shieldGrad)" stroke="url(#goldRim)" stroke-width="10" filter="url(#glow2)" />

  <!-- Inner Shield Cutout -->
  <path d="M 256 126
           L 328 156
           L 328 214
           C 328 260, 294 296, 256 318
           C 218 296, 184 260, 184 214
           L 184 156 Z"
        fill="#101a2d" stroke="#f2c97d" stroke-width="4" opacity="0.95" />

  <!-- Smart Store + Cloud Eye Symbol Inside Shield -->
  <circle cx="256" cy="212" r="30" fill="none" stroke="#72d3a7" stroke-width="6" />
  <circle cx="256" cy="212" r="12" fill="#f2c97d" />
  <path d="M 212 256 L 300 256" stroke="#d4a453" stroke-width="6" stroke-linecap="round" />
</svg>
